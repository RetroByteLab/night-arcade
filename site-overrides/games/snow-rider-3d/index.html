<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#d8edf8"><title>Snow Rider 3D — Night Arcade</title>
<link rel="stylesheet" href="TemplateData/style.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8edf8}body{position:fixed;inset:0}.webgl-content{position:fixed!important;inset:0!important;top:0!important;left:0!important;transform:none!important;width:100vw;height:100vh}#gameContainer{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;margin:0!important}#gameContainer canvas{display:block!important;width:100%!important;height:100%!important;outline:none}.logo,.progress,.text{z-index:2}.load-error{position:fixed;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);display:none;padding:9px 14px;border-radius:10px;background:#112b43;color:white;font:13px system-ui,sans-serif}.load-error.show{display:block}
</style>
<script src="TemplateData/UnityProgress.js"></script><script src="Build/UnityLoader.js"></script>
</head>
<body>
<div class="webgl-content"><div id="gameContainer" style="width:960px;height:600px;margin:auto" aria-label="Snow Rider 3D"></div></div>
<div id="loadError" class="load-error" role="status">Snow Rider could not finish loading. Refresh to try again.</div>
<script>
(function(){
  var error=document.getElementById('loadError');
  window.addEventListener('error',function(){error.classList.add('show')});
  window.addEventListener('unhandledrejection',function(){error.classList.add('show')});
  window.addEventListener('load',function(){
    try {
      window.gameInstance=UnityLoader.instantiate('gameContainer','Build/SnowRider3D-gd-1.json',{
        onProgress:UnityProgress,
        Module:{onRuntimeInitialized:function(){UnityProgress(window.gameInstance,'complete')}}
      });
    } catch (e) { error.classList.add('show'); }
  });
})();
</script>
</body></html>
