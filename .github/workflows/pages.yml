name: Publish Night Arcade library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site-overrides/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download checked publishing archive
        run: |
          curl --fail --location --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.0/night-arcade-google-sites.zip" --output /tmp/library.zip
          echo '9032cd44beabfa319515f1c25205236b67ae409171866b7e05697f0b2aee5336  /tmp/library.zip' | sha256sum --check
          mkdir _site
          unzip -q /tmp/library.zip -d _site
          touch _site/.nojekyll
      - name: Apply reviewed interface updates
        run: cp site-overrides/app.js site-overrides/styles.css site-overrides/index.html site-overrides/games.json site-overrides/embed-player.js site-overrides/embed-sizes.json _site/
      - name: Build authorized Flipline classics
        run: |
          python3 site-overrides/scripts/import-flipline.py
          cp -R site-overrides/games/. _site/games/
          cp -R site-overrides/vendor _site/
          cp site-overrides/REQUESTED-GAMES.md _site/
          cp site-overrides/catalog-sources/flipline.json site-overrides/catalog-sources/random-sports.json _site/catalog-sources/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static library
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy library
        id: deployment
        uses: actions/deploy-pages@v4
